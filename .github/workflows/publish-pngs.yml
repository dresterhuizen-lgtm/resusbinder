name: Publish professional PNG teaching handouts
on:
  push:
    branches: [main]
    paths:
      - 'publications/png/**'
      - 'scripts/publish_pngs.py'
      - '.github/workflows/publish-pngs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resus-png-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0 PyMuPDF==1.26.4
      - name: Generate and index PNG handouts
        run: python scripts/publish_pngs.py
      - name: Commit PNG handouts
        run: |
          git add assets/*.png uploads.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "resusbinder-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace recent study PDFs with professional PNG handouts"
          git pull --rebase
          git push
