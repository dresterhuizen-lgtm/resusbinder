name: Publish Daily Resuscitation Learning PNG
on:
  push:
    branches: [main]
    paths:
      - 'publications/daily/**'
      - 'scripts/publish_daily_steroid_png.py'
      - '.github/workflows/publish-daily-steroid-png.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resus-daily-png
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Render and verify clinical PNG
        run: python scripts/publish_daily_steroid_png.py
      - name: Commit image and catalog without altering other entries
        run: |
          git add assets/daily-2026-11-14-septic-shock-steroids.png uploads.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "resusbinder-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish 14 Nov septic shock steroids PNG teaching page"
          git pull --rebase
          git push
