<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resus Binder · Upload</title><style>:root{color-scheme:dark}body{font:16px/1.5 system-ui;background:#08111e;color:#edf5ff;margin:0;padding:30px 16px}main{max-width:630px;margin:35px auto;padding:28px;border:1px solid #29435f;border-radius:18px;background:#102030}h1{margin:0 0 8px}p{color:#a9bbcd}label{display:block;font-weight:700;margin:18px 0 6px}input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #38516d;background:#08111e;color:white;font:inherit}button{background:#4dd8f6;color:#07101c;font-weight:800;cursor:pointer;margin-top:24px}button:disabled{opacity:.55}#status{white-space:pre-wrap;margin-top:16px}a{color:#4dd8f6}</style></head><body><main><a href="/">← Back to Resus Binder</a><h1>Upload a document</h1><p>Private uploader for PDFs and clinical teaching images. Files publish to your existing Resus Binder site after Netlify redeploys.</p><form id="form"><label for="key">Private upload key</label><input id="key" type="password" autocomplete="off" required placeholder="Key configured in Netlify"><label for="title">Document title</label><input id="title" required maxlength="180" placeholder="Daily Resuscitation Learning — RSI"><label for="category">Section</label><select id="category"><option>Studies</option><option>Resus Binder</option><option>CCR</option></select><label for="file">PDF, PNG or JPEG (maximum 5 MB)</label><input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" required><button id="submit">Publish document</button></form><div id="status" role="status" aria-live="polite"></div><p style="font-size:13px">Your upload key is used only for this request and is not saved in the browser. Never place your GitHub token here.</p></main><script>const form=document.getElementById('form'),status=document.getElementById('status'),button=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();const file=document.getElementById('file').files[0];if(!file)return;if(file.size>5*1024*1024){status.textContent='File exceeds 5 MB';return}button.disabled=true;status.textContent='Uploading…';try{const b64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});const response=await fetch('/.netlify/functions/upload',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+document.getElementById('key').value},body:JSON.stringify({title:document.getElementById('title').value,category:document.getElementById('category').value,mime:file.type||({pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg'}[file.name.split('.').pop().toLowerCase()]),base64:b64})});const data=await response.json();if(!response.ok)throw Error(data.error||'Upload failed');status.textContent='Uploaded to GitHub. Netlify will publish shortly. File: '+data.path+'\nSHA-256: '+data.sha256;form.reset()}catch(error){status.textContent='Upload failed: '+error.message}finally{button.disabled=false}});</script></body></html>
